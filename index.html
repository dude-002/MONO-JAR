<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIMKI COFFEE - твоя найкраща кава</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1c1c1e;
            padding: 30px 24px;
            border-radius: 24px;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
            font-weight: 700;
        }
        .description {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .btn {
            background-color: #ffffff;
            color: #000000;
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            width: 100%;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.96);
        }
        /* Стильний блок підказки */
        .hint-box {
            margin-top: 20px;
            padding: 12px 14px;
            background-color: #2c2c2e;
            border-radius: 12px;
            font-size: 13px;
            color: #d1d1d6;
            line-height: 1.4;
        }
        .hint-box strong {
            color: #ffffff;
        }
        /* Блок соцмереж */
        .socials {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #2c2c2e;
            display: flex;
            gap: 10px;
        }
        .social-btn {
            flex: 1;
            color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        
        /* Колір Instagram (Фірмовий градієнт) */
        .social-btn.instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        /* Колір Threads (Офіційний чорний з білим кантом) */
        .social-btn.threads {
            background-color: #000000;
            border: 1px solid #3a3a3c;
        }

        .social-btn:active {
            opacity: 0.8;
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Дякую! 🤍</h2>
        <p class="description">Щоб залишити чайові без папірців, натисніть кнопку нижче</p>
        
        <form action="https://send.monobank.ua/jar/36hcGtFoDK" method="GET">
            <input type="hidden" name="noapp" value="1">
            <button type="submit" class="btn"><strong>⇨ ТИЦЬ ⇦</strong></button>
        </form>

        <!-- Окремий блок-підказка -->
        <div class="hint-box">
            💡 Якщо у Вас встановлений додаток Mono - натисніть <strong>«Скасувати»</strong> у спливаючому вікні.
        </div>

        <!-- Посилання на соцмережі з брендовими кольорами -->
        <div class="socials">
            <a href="https://instagram.com/pimkicoffee" target="_blank" class="social-btn instagram">
                Instagram
            </a>
            <a href="https://threads.net/@pimkicoffee" target="_blank" class="social-btn threads">
                Threads
            </a>
        </div>
    </div>

</body>
</html>
