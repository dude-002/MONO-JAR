<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIMKI COFFEE - твоя найкраща кава</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1c1c1e;
            padding: 30px 24px;
            border-radius: 24px;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
            font-weight: 700;
        }
        p {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .btn {
            background-color: #ffffff;
            color: #000000;
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            width: 100%;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Залишити чайові без папірців</h2>
        <p>Просто нажміть на кнопку нижче. Дякую!</p>
        
        <!-- Форма замість звичайного посилання обходить Universal Links в iOS -->
        <form action="https://send.monobank.ua/jar/36hcGtFoDK" method="GET">
            <input type="hidden" name="noapp" value="1">
            <button type="submit" class="btn">ТИЦЬ ♡</button>
        </form>
    </div>

</body>
</html>
