<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твоя найкраща кава в PIMKI</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1c1c1e;
            padding: 30px 24px;
            border-radius: 20px;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            font-weight: 600;
        }
        p {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .btn {
            background-color: #ffffff;
            color: #000000;
            padding: 16px 20px;
            text-decoration: none;
            border-radius: 14px;
            display: block;
            font-weight: 700;
            font-size: 16px;
            transition: transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Подякувати 🧡</h2>
        <p>Щоб залишити чайові без папірців, натисніть кнопку нижче</p>
        <a class="btn" href="https://send.monobank.ua/jar/36hcGtFoDK?noapp=1">•CLICK•</a>
    </div>

</body>
</html>
